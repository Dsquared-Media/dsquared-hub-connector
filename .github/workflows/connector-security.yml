name: Connector security contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: curl, openssl, dom, zip
          coverage: none
      - run: php tests/connector-containment.php
      - run: php tests/connector-uninstall.php
      - name: Upload security hooks (offline WordPress hooks, modeled provider)
        run: |
          for mode in present missing; do
            upload_fixture_dir=$(mktemp -d)
            if [ "$mode" = missing ]; then
              php tests/svg-hook-security.php --wordpress-root=tests/fixtures/wp683-hooks --workspace="$upload_fixture_dir" --missing-dom
            else
              php tests/svg-hook-security.php --wordpress-root=tests/fixtures/wp683-hooks --workspace="$upload_fixture_dir"
            fi
          done
      - run: php tests/link-scanner-security.php
      - run: php tests/link-scanner-security.php --iri=wp62
      - name: Native WordPress HTTP compatibility (local endpoints only)
        run: |
          for wp_version in wp58 wp62; do
            scanner_fixture_dir=$(mktemp -d)
            php tests/scanner-transport-security.php --wp="$wp_version" --temp="$scanner_fixture_dir"
          done
      - run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - run: node --test tests/*.test.js
      - run: python3 tests/package-plugin-test.py
  package-review-artifact:
    needs: containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build review ZIP only (never a GitHub release)
        run: python3 scripts/package-plugin.py --commit "$(git rev-parse HEAD)" --output-dir build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/*
          if-no-files-found: error
