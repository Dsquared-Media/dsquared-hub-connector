name: Connector security contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containment:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - run: php tests/connector-containment.php
      - run: php tests/connector-uninstall.php
      - run: php tests/privacy-csv.php
      - run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - run: node --test tests/*.test.js
  package-review-artifact:
    needs: containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve exact candidate commit
        id: candidate
        run: |
          SHA="$(git rev-parse HEAD)"
          test "${#SHA}" -eq 40
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Build exact review package twice
        run: |
          first="$(mktemp -d)"
          second="$(mktemp -d)"
          bash scripts/build-connector-package.sh "${{ steps.candidate.outputs.sha }}" "$first"
          bash scripts/build-connector-package.sh "${{ steps.candidate.outputs.sha }}" "$second"
          cmp "$first/dsquared-hub-connector.zip" "$second/dsquared-hub-connector.zip"
          cmp "$first/dsquared-hub-connector.zip.sha256" "$second/dsquared-hub-connector.zip.sha256"
          mkdir candidate
          cp "$first"/dsquared-hub-connector.zip* "$first"/dsquared-hub-connector.manifest.txt candidate/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-candidate-${{ steps.candidate.outputs.sha }}
          if-no-files-found: error
          path: candidate/
