name: Promote reviewed connector package to draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag, for example v1.23.1
        required: true
        type: string
      approved_commit:
        description: Exact approved 40-character commit SHA
        required: true
        type: string
      approved_sha256:
        description: SHA-256 of the independently reviewed ZIP
        required: true
        type: string
      candidate_run_id:
        description: Successful Connector security contract run containing the reviewed candidate
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  promote-reviewed-package:
    runs-on: ubuntu-latest
    environment: connector-release
    steps:
      - name: Verify and promote the exact reviewed bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]

          TAG_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')"
          test "$TAG_COMMIT" = "$APPROVED_COMMIT"

          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$APPROVED_COMMIT"
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = "success"
          WORKFLOW_ID="$(jq -r '.workflow_id' <<<"$RUN_JSON")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID" --jq '.path')" = ".github/workflows/connector-security.yml"

          ARTIFACT="connector-candidate-$APPROVED_COMMIT"
          mkdir candidate
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir candidate

          test -f candidate/dsquared-hub-connector.zip
          test -f candidate/dsquared-hub-connector.zip.sha256
          test -f candidate/dsquared-hub-connector.manifest.txt
          test "$(awk '{print $1}' candidate/dsquared-hub-connector.zip.sha256)" = "$APPROVED_SHA256"
          test "$(awk '/^Source-Commit:/{print $2}' candidate/dsquared-hub-connector.manifest.txt)" = "$APPROVED_COMMIT"
          echo "$APPROVED_SHA256  candidate/dsquared-hub-connector.zip" | sha256sum -c -

          VERSION="${TAG#v}"
          test "$(unzip -p candidate/dsquared-hub-connector.zip dsquared-hub-connector/dsquared-hub-connector.php | sed -n 's/^[[:space:]]*\* Version:[[:space:]]*//p' | head -1)" = "$VERSION"
          test "$(unzip -p candidate/dsquared-hub-connector.zip dsquared-hub-connector/readme.txt | sed -n 's/^Stable tag:[[:space:]]*//p' | head -1)" = "$VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace or clobber assets." >&2
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes "Draft connector release. Approved commit: $APPROVED_COMMIT. Approved ZIP SHA-256: $APPROVED_SHA256. Candidate run: $CANDIDATE_RUN_ID." \
            candidate/dsquared-hub-connector.zip \
            candidate/dsquared-hub-connector.zip.sha256 \
            candidate/dsquared-hub-connector.manifest.txt
